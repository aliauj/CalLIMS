{% extends "administration/base_admin.html" %}
{% block title %}{{ action }} Unit — CalLIMS Admin{% endblock %}
{% block content %}
<div class="max-w-lg">
  <h2 class="text-2xl font-bold text-gray-900 mb-6">{{ action }} Measurement Unit</h2>
  <form method="post" class="bg-white rounded-xl shadow p-6 space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Symbol <span class="text-red-500">*</span></label>
      <input type="text" name="symbol" required value="{{ unit.symbol|default:'' }}"
        placeholder="e.g. mm, °C, kPa"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm font-mono">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Full Name <span class="text-red-500">*</span></label>
      <input type="text" name="name" required value="{{ unit.name|default:'' }}"
        placeholder="e.g. Millimetre, Degree Celsius"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Quantity Type <span class="text-red-500">*</span></label>
      <input type="text" name="quantity_type" required value="{{ unit.quantity_type|default:'' }}"
        placeholder="e.g. Length, Temperature, Pressure"
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="bg-blue-800 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 text-sm">Save Unit</button>
      <a href="{% url 'administration:unit_list' %}" class="bg-gray-100 text-gray-700 px-6 py-2 rounded-lg font-medium hover:bg-gray-200 text-sm">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
