{% extends "administration/base_admin.html" %}
{% block title %}{{ action }} User — CalLIMS Admin{% endblock %}
{% block content %}
<div class="max-w-xl">
  <h2 class="text-2xl font-bold text-gray-900 mb-6">{{ action }} User</h2>
  <form method="post" class="bg-white rounded-xl shadow p-6 space-y-5">
    {% csrf_token %}
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">First Name <span class="text-red-500">*</span></label>
        <input type="text" name="first_name" required value="{{ user_obj.first_name|default:'' }}"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Last Name <span class="text-red-500">*</span></label>
        <input type="text" name="last_name" required value="{{ user_obj.last_name|default:'' }}"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Email <span class="text-red-500">*</span></label>
      <input type="email" name="email" required value="{{ user_obj.email|default:'' }}"
        {% if action == 'Edit' %}readonly class="w-full px-3 py-2 border border-gray-200 bg-gray-50 rounded-lg text-sm text-gray-500"
        {% else %}class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm"{% endif %}>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Password {% if action == 'Edit' %}<span class="text-gray-400 font-normal">(leave blank to keep current)</span>{% else %}<span class="text-red-500">*</span>{% endif %}
      </label>
      <input type="password" name="password" {% if action == 'Create' %}required{% endif %}
        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm"
        placeholder="{% if action == 'Edit' %}Leave blank to keep unchanged{% endif %}">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Role <span class="text-red-500">*</span></label>
      <select name="role" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
        {% for val, label in role_choices %}
        <option value="{{ val }}" {% if user_obj.role == val %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    {% if action == 'Edit' %}
    <div class="flex items-center gap-3">
      <input type="checkbox" name="is_active" id="is_active" value="1"
        {% if user_obj.is_active %}checked{% endif %}
        class="w-4 h-4 text-blue-600 rounded border-gray-300">
      <label for="is_active" class="text-sm font-medium text-gray-700">Account Active</label>
    </div>
    {% endif %}
    <div class="flex gap-3 pt-2">
      <button type="submit" class="bg-blue-800 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 text-sm">
        {{ action }} User
      </button>
      <a href="{% url 'administration:user_list' %}" class="bg-gray-100 text-gray-700 px-6 py-2 rounded-lg font-medium hover:bg-gray-200 text-sm">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
