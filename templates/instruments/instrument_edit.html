{% extends "base.html" %}
{% block title %}Edit {{ instrument.asset_tag }} — CalLIMS{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto space-y-6">

  <!-- Breadcrumb -->
  <div>
    <p class="text-xs text-gray-500 uppercase tracking-wide mb-1">
      <a href="{% url 'instruments:instrument_list' %}" class="hover:underline">Instruments</a> /
      <a href="{% url 'instruments:instrument_detail' instrument.pk %}" class="hover:underline">{{ instrument.asset_tag }}</a> /
      Edit
    </p>
    <h2 class="text-2xl font-bold text-gray-900">Edit Instrument</h2>
  </div>

  <form method="post" class="bg-white rounded-xl shadow p-6 space-y-5">
    {% csrf_token %}

    <!-- Identification -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Instrument Tag <span class="text-red-500">*</span>
        </label>
        <input type="text" name="asset_tag" required
               value="{{ instrument.asset_tag }}"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm font-mono">
        <p class="text-xs text-gray-400 mt-1">Changing this updates all references.</p>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Serial Number <span class="text-red-500">*</span>
        </label>
        <input type="text" name="serial_number" required
               value="{{ instrument.serial_number }}"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm font-mono">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Description <span class="text-red-500">*</span>
      </label>
      <input type="text" name="description" required
             value="{{ instrument.description }}"
             class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Manufacturer</label>
        <input type="text" name="manufacturer"
               value="{{ instrument.manufacturer }}"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Model Number</label>
        <input type="text" name="model_number"
               value="{{ instrument.model_number }}"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Client</label>
        <select name="client"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
          <option value="">Internal / No Client</option>
          {% for c in clients %}
          <option value="{{ c.pk }}" {% if instrument.client_id == c.pk %}selected{% endif %}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Category</label>
        <select name="category"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
          <option value="">— Uncategorized —</option>
          {% for cat in categories %}
          <option value="{{ cat.pk }}" {% if instrument.category_id == cat.pk %}selected{% endif %}>
            {{ cat.name }}{% if cat.code %} ({{ cat.code }}){% endif %}
          </option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
        <select name="status"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
          {% for val, label in status_choices %}
          <option value="{{ val }}" {% if instrument.status == val %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
        <input type="text" name="location"
               value="{{ instrument.location }}"
               placeholder="Lab room, shelf, etc."
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Calibration Interval (days)</label>
        <input type="number" name="calibration_interval_days" min="1"
               value="{{ instrument.calibration_interval_days }}"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Purchase Date</label>
        <input type="date" name="purchase_date"
               value="{{ instrument.purchase_date|date:'Y-m-d'|default:'' }}"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
      <textarea name="notes" rows="3"
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">{{ instrument.notes }}</textarea>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="submit"
              class="bg-blue-800 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 text-sm">
        Save Changes
      </button>
      <a href="{% url 'instruments:instrument_detail' instrument.pk %}"
         class="bg-gray-100 text-gray-700 px-6 py-2 rounded-lg font-medium hover:bg-gray-200 text-sm">
        Cancel
      </a>
    </div>

  </form>
</div>
{% endblock %}
