{% extends "base.html" %}
{% block title %}New Calibration Job — CalLIMS{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <h2 class="text-2xl font-bold text-gray-900 mb-6">Create Calibration Job</h2>
  <form method="post" class="bg-white rounded-xl shadow p-6 space-y-5">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Instrument / Gauge <span class="text-red-500">*</span></label>
      <select name="instrument" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
        <option value="">— Select instrument —</option>
        {% for instr in instruments %}
        <option value="{{ instr.pk }}" {% if preselected_instrument == instr.pk|stringformat:'s' %}selected{% endif %}>{{ instr.asset_tag }} — {{ instr.description }}{% if instr.client %} ({{ instr.client }}){% endif %}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Calibration Method <span class="text-red-500">*</span></label>
      <select name="method" required class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
        <option value="">— Select method —</option>
        {% for m in methods %}
        <option value="{{ m.pk }}">{{ m.code }} — {{ m.name }} (v{{ m.version }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
        <select name="priority" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
          <option value="1">High</option>
          <option value="2" selected>Normal</option>
          <option value="3">Low</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Due Date</label>
        <input type="date" name="due_date" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
      <textarea name="notes" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-sm"></textarea>
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="bg-blue-800 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 text-sm">Create Job</button>
      <a href="{% url 'workflows:job_list' %}" class="bg-gray-100 text-gray-700 px-6 py-2 rounded-lg font-medium hover:bg-gray-200 text-sm">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
