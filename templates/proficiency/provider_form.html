{% extends "base.html" %}
{% block title %}{{ action }} Provider — CalLIMS{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto space-y-5">
  <div>
    <p class="text-xs text-gray-500 uppercase tracking-wide mb-1">
      <a href="{% url 'proficiency:scheme_list' %}" class="hover:underline">Proficiency Testing</a> /
      <a href="{% url 'proficiency:provider_list' %}" class="hover:underline">Providers</a> /
      {{ action }}
    </p>
    <h2 class="text-2xl font-bold text-gray-900">{{ action }} PT Provider</h2>
  </div>

  <form method="post" class="bg-white rounded-xl shadow p-6 space-y-5">
    {% csrf_token %}

    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Provider Code <span class="text-red-500">*</span></label>
        <input type="text" name="code" required value="{{ provider.code|default:'' }}" placeholder="SANAS-PT"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm uppercase focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Provider Name <span class="text-red-500">*</span></label>
        <input type="text" name="name" required value="{{ provider.name|default:'' }}" placeholder="South African National Accreditation System"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Accreditation Body</label>
        <input type="text" name="accreditation_body" value="{{ provider.accreditation_body|default:'' }}" placeholder="ILAC, APLAC, EA…"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contact Email</label>
        <input type="email" name="contact_email" value="{{ provider.contact_email|default:'' }}"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="md:col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Website</label>
        <input type="url" name="website" value="{{ provider.website|default:'' }}" placeholder="https://…"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500">
      </div>
      <div class="md:col-span-2">
        <label class="flex items-center gap-2 text-sm text-gray-700 cursor-pointer">
          <input type="checkbox" name="is_active" {% if provider.is_active or not provider %}checked{% endif %} class="rounded">
          Active (available for new schemes)
        </label>
      </div>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="submit" class="px-5 py-2 bg-blue-600 text-white text-sm rounded-lg hover:bg-blue-700">{{ action }} Provider</button>
      <a href="{% url 'proficiency:provider_list' %}" class="px-5 py-2 border border-gray-300 text-sm rounded-lg text-gray-700 hover:bg-gray-50">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
