{% extends "base.html" %}
{% block title %}Profile — CalLIMS{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
  <h2 class="text-2xl font-bold text-gray-900 mb-6">My Profile</h2>
  <div class="bg-white rounded-xl shadow p-6">
    <div class="grid grid-cols-2 gap-4 text-sm">
      <div><span class="text-gray-500 block">Full Name</span><p class="font-medium">{{ user_obj.get_full_name }}</p></div>
      <div><span class="text-gray-500 block">Email</span><p class="font-medium">{{ user_obj.email }}</p></div>
      <div><span class="text-gray-500 block">Role</span><p class="font-medium">{{ user_obj.get_role_display }}</p></div>
      <div><span class="text-gray-500 block">Member Since</span><p class="font-medium">{{ user_obj.date_joined|date:"N j, Y" }}</p></div>
    </div>
  </div>
</div>
{% endblock %}
