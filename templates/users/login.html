{% extends "base.html" %}
{% block title %}Login — CalLIMS{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center -mt-6">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-blue-900">CalLIMS</h1>
      <p class="text-gray-500 mt-1 text-sm">Calibration Laboratory Information Management System</p>
    </div>
    {% if messages %}
      {% for message in messages %}
      <div class="mb-4 p-3 rounded bg-red-100 text-red-800 text-sm">{{ message }}</div>
      {% endfor %}
    {% endif %}
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
        <input type="email" name="email" required autofocus
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" required
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
      </div>
      <button type="submit"
        class="w-full bg-blue-800 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700 transition text-sm mt-2">
        Sign In
      </button>
    </form>
  </div>
</div>
{% endblock %}
